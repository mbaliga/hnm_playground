<title>HAfx Studio Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* An instrument, not a page: the eyepiece is the hero, the Tactile Kit is the hardware around it.
     AMOLED single look by choice (the kit's own surface). */
  :root {
    --void: #000; --surface: #0b0b0e; --ink: rgba(255,255,255,.58); --ink2: rgba(255,255,255,.3); --ink3: rgba(255,255,255,.12);
    --violet: #8e7bff; --cyan: #08fed5;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --field: min(56vh, 36vw);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--void); color: var(--ink); font-family: var(--mono); overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  /* the kit's halo, retuned from its default blue to Hyle violet/cyan */
  hy-voice { --halo: #8e7bff; }
  hy-crater[icon] { display: flex; width: 92px; }
  hy-digital-display { display: block; width: 100%; }
  hy-digital-display::part(matrix) { aspect-ratio: auto; height: 46px; border-radius: 10px; }

  .rig { height: 100%; display: grid; gap: 14px 36px; padding-block: 16px 52px; justify-content: center; align-content: center;
    grid-template-columns: minmax(220px, 1fr) var(--field) minmax(220px, 1fr); grid-template-rows: auto auto auto auto;
    grid-template-areas: "power center stage" "focus center zoom" "voice center rec" "voice led meters"; align-items: center; justify-items: center; }
  .g-power { grid-area: power; } .g-focus { grid-area: focus; } .g-zoom { grid-area: zoom; } .g-stage { grid-area: stage; }
  .g-voice { grid-area: voice; } .g-rec { grid-area: rec; }
  .center { grid-area: center; display: grid; place-items: center; position: relative; align-self: stretch; }
  #field { width: var(--field); height: var(--field); display: block; border-radius: 50%; touch-action: manipulation; }
  .led { grid-area: led; width: calc(var(--field) * .8); justify-self: center; }
  .meters { grid-area: meters; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(240px, 100%); }
  .meters hy-vu, .meters hy-meter { width: 100%; }

  .rack { display: contents; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .grp .row { display: flex; align-items: center; gap: 22px; }
  .lbl { font: 500 9px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--ink2); }
  .g-voice hy-voice { width: min(330px, 26vw); }

  /* phone: eyepiece on top, the instrument as a rack you swipe (the performance steers it) */
  @media (max-width: 979px), (max-height: 560px) {
    :root { --field: min(84vw, 42vh); }
    .rig { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 12px 48px; }
    .led { width: calc(var(--field) * .86); }
    .meters { display: none; }
    .center { align-self: auto; }
    .rack { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; width: 100vw; flex: 1; min-height: 0;
      margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); scrollbar-width: none; }
    .rack::-webkit-scrollbar { display: none; }
    .grp { flex: 0 0 100vw; scroll-snap-align: center; justify-content: center; }
    .g-voice hy-voice { width: min(340px, 86vw); }
  }

  /* the ghost fingertip: only transform + opacity animate, so it never repaints */
  .ghost { position: fixed; left: 0; top: 0; width: 40px; height: 40px; pointer-events: none; z-index: 30; will-change: transform; contain: strict; }
  .ghost::before, .ghost::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .ghost::before { background: radial-gradient(circle, rgba(255,255,255,.55), rgba(142,123,255,.28) 46%, rgba(142,123,255,0) 70%); border: 1px solid rgba(255,255,255,.22); }
  .ghost::after { inset: -14px; background: radial-gradient(circle, rgba(142,123,255,.42), rgba(142,123,255,0) 65%); opacity: var(--press, 0); will-change: opacity; }
  .begin { position: absolute; inset: 0; margin: auto; width: 46%; height: 46%; border-radius: 50%; border: 1px solid rgba(142,123,255,.35);
    background: radial-gradient(circle, rgba(142,123,255,.12), rgba(0,0,0,0) 70%); color: var(--ink); cursor: pointer;
    font: 500 11px/1.6 var(--mono); letter-spacing: .3em; text-transform: lowercase; animation: breathe 2.4s ease-in-out infinite; }
  .begin b { display: block; font: 800 clamp(20px, 3.4vw, 30px)/1 var(--display); letter-spacing: .02em; color: #fff; text-transform: none; margin-bottom: 8px; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(142,123,255,.06); } }
  .again { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    appearance: none; background: none; border: 1px solid rgba(142,123,255,.4); color: var(--ink); font: 500 10px/1 var(--mono);
    letter-spacing: .24em; padding: 9px 14px; border-radius: 999px; cursor: pointer; z-index: 5; }
  .paths { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px; font-size: 9.5px; letter-spacing: .16em; color: var(--ink2); z-index: 5; }
  .path { display: flex; align-items: center; gap: 6px; }
  .path i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor;
    background: rgba(8,254,213, var(--lvl, 0)); box-shadow: 0 0 calc(10px * var(--lvl, 0)) rgba(8,254,213, var(--lvl, 0)); }
  .path[data-on="1"] { color: var(--ink); } .path[data-on="0"] { opacity: .45; }
  .info { appearance: none; background: none; border: 1px solid var(--ink2); color: var(--ink2); width: 20px; height: 20px; border-radius: 50%;
    font: 500 10px/1 var(--mono); cursor: pointer; padding: 0; }
  .tip { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 6;
    max-width: min(340px, calc(100vw - 32px)); font-size: 11px; line-height: 1.65; color: var(--ink);
    background: rgba(12,10,22,.94); border: 1px solid rgba(142,123,255,.25); border-radius: 12px; padding: 12px 14px; }
  .tip b { color: var(--cyan); font-weight: 500; }
  button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
  .taptic { position: fixed; left: -40px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  body.auto .rack { scroll-snap-type: none; }
  @media (prefers-reduced-motion: reduce) { .begin { animation: none; } }
</style>

<main class="rig">
  <section class="center">
    <canvas id="field" aria-label="Microscope field of view"></canvas>
    <button class="begin" id="begin"><b>HAfx Studio</b>tap to begin</button>
  </section>
  <div class="led"><hy-digital-display id="led" variant="led" text="HAfx STUDIO      " speed="0.5"></hy-digital-display></div>
  <div class="meters"><hy-vu id="vu"></hy-vu><hy-meter id="meter"></hy-meter></div>
  <div class="rack" id="rack">
    <div class="grp g-power"><div class="row"><hy-crater id="power" variant="power"></hy-crater><hy-toggle id="lamp" variant="smooth"></hy-toggle></div><span class="lbl">power · lamp</span></div>
    <div class="grp g-focus"><hy-knob id="focus" variant="precision" value="12"></hy-knob><span class="lbl">focus</span></div>
    <div class="grp g-zoom"><hy-fader id="zoom" value="10"></hy-fader><span class="lbl">magnification</span></div>
    <div class="grp g-stage"><hy-joystick id="stick"></hy-joystick><span class="lbl">stage</span></div>
    <div class="grp g-voice"><hy-voice id="voice" hot="-1"></hy-voice><span class="lbl">voice · design the pulse</span></div>
    <div class="grp g-rec"><div class="row"><hy-crater id="rec" icon="record"></hy-crater><hy-transport id="transport"></hy-transport></div><span class="lbl">rec · play</span></div>
  </div>
</main>

<div class="ghost" id="ghost" hidden></div>
<button class="again" id="again" hidden>again</button>
<div class="paths" aria-label="Output paths">
  <span class="path" data-k="sound"><i></i>sound</span><span class="path" data-k="body"><i></i>body</span>
  <span class="path" data-k="touch"><i></i>touch</span><span class="path" data-k="sight"><i></i>sight</span>
  <button class="info" id="info" aria-label="How this device feels it" aria-expanded="false">i</button>
</div>
<div class="tip" id="tip" hidden></div>
<label class="taptic" id="tapticLabel" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>/*__BUNDLE__*/</script>
