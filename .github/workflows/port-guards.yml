name: Port guards

# Keeps the default build free of platform-port leakage (plan X2). Plain jobs, no artifacts.
# TODO(pin): actions below use version tags because the commit SHAs could not be resolved offline;
# replace each with its SHA (R3) before relying on this workflow.

on:
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    name: Path lint, commonMain purity, project list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard self-test
        run: python3 -I tools/test_port_guards.py

      - name: Windows path lint and commonMain purity
        run: python3 -I tools/port_guards.py --paths --purity

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # With no ENABLE_* variable set, no ios/wasm/Ubuntu Touch module may appear in the project list.
      - name: Root build unchanged (project list)
        run: python3 -I tools/port_guards.py --projects
